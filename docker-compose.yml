version: '3.9'
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: portal_obra
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: portal
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://portal:portal@postgres:5432/portal_obra
      SECRET_KEY: super-secret
      SCHEDULER_ENABLED: "true"
    depends_on:
      - postgres
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  pg_data:
